<!DOCTYPE html>
<html>
<head>
  <title>Render Test</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; }
  </style>
</head>
<body>
  <div id="info">Testing...</div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    
    const info = document.getElementById('info');
    
    // Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    // Red cube
    const geo = new THREE.BoxGeometry(2, 2, 2);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const cube = new THREE.Mesh(geo, mat);
    scene.add(cube);
    
    // Blue ground
    const groundGeo = new THREE.PlaneGeometry(10, 10);
    const groundMat = new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2;
    scene.add(ground);
    
    camera.position.z = 5;
    camera.position.y = 2;
    camera.lookAt(0, 0, 0);
    
    info.innerHTML = `Scene children: ${scene.children.length}<br>Camera: ${camera.position.z}`;
    
    // Animate
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    
    animate();
    info.innerHTML += '<br>✅ Rendering!';
  </script>
</body>
</html>
