<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Streets - Crimson Bay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      overflow: hidden;
      background: #000;
      color: #fff;
    }
    
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    #topBar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    #health {
      color: #ff3366;
    }
    
    #cash {
      color: #33ff66;
    }
    
    #wanted {
      display: flex;
      gap: 4px;
    }
    
    .star {
      width: 20px;
      height: 20px;
      display: inline-block;
      position: relative;
    }
    
    .star::before {
      content: '★';
      font-size: 20px;
      color: #666;
    }
    
    .star.active::before {
      color: #ffaa00;
      text-shadow: 0 0 10px #ff6600;
    }
    
    #minimap {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 200px;
      height: 200px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #fff;
      border-radius: 4px;
    }
    
    #objective {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      border-radius: 4px;
      font-size: 16px;
      text-align: center;
      max-width: 600px;
      display: none;
    }
    
    #speedometer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      display: none;
    }
    
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    
    #menu h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ff3366;
      text-shadow: 0 0 20px #ff3366;
    }
    
    #menu h2 {
      font-size: 24px;
      margin-bottom: 40px;
      color: #33ffff;
    }
    
    .menuButton {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 15px 40px;
      font-size: 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      pointer-events: all;
      transition: transform 0.2s;
    }
    
    .menuButton:hover {
      transform: scale(1.05);
    }
    
    #menu.hidden {
      display: none;
    }
    
    #pauseMenu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    
    #pauseMenu.active {
      display: flex;
    }
    
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      z-index: 300;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Crimson Bay...</div>
  
  <div id="menu">
    <h1>NEON STREETS</h1>
    <h2>Crimson Bay</h2>
    <button class="menuButton" onclick="window.game?.start()">START GAME</button>
  </div>
  
  <div id="pauseMenu">
    <h1>PAUSED</h1>
    <button class="menuButton" onclick="window.game?.resume()">RESUME</button>
    <button class="menuButton" onclick="window.game?.returnToMenu()">MAIN MENU</button>
  </div>
  
  <div id="hud">
    <div id="topBar">
      <div>
        <div id="health">HEALTH: <span id="healthValue">100</span></div>
        <div id="cash">CASH: $<span id="cashValue">0</span></div>
      </div>
      <div id="wanted">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
      </div>
    </div>
    
    <div id="objective"></div>
    
    <canvas id="minimap"></canvas>
    
    <div id="speedometer">
      <span id="speed">0</span> MPH
    </div>
  </div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  
  <script type="module" src="./src/main.js"></script>
</body>
</html>
